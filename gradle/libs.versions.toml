[versions]
kotlin = "2.4.21"
poet = "2.4.0"
# Built on Kotlin 2.4.10, which the stdlib of Gradle 9.9, Kreate's minimum, covers. A release that
# needs a newer stdlib than a plugin finds at runtime on that Gradle waits for the minimum to move.
serialization = "1.13.0"
# Built on Kotlin 2.3.21, for the same reason.
ktor = "3.6.1"
freemarker = "2.3.35"
jackson = "2.23.0"
# Floor of the Bouncy Castle that the Kotlin Gradle plugin resolves, see
# `build-logic/src/main/kotlin/kreate.kotlin-conventions.gradle.kts`.
bouncycastle = "1.87"
dokka = "2.3.0"
publish = "0.37.0"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
jacoco = "0.8.16"
# Kore, Knot and Konnect need the stdlib 2.4.21, which Gradle 9.9.0, Kreate's minimum, embeds exactly. A
# release of them that needs a newer stdlib waits for the minimum to move.
kore = "2.5.0"
knot = "1.2.0"
konnect = "1.1.0"

# test & tooling
junit = "6.1.3"
kotest = "6.2.7"
mockk = "1.14.12"
asm = "9.11.1"
bcv = "0.18.2"
benchmark = "0.5.0"
ksp = "2.3.14"

[libraries]
poet-core = { module = "com.squareup:kotlinpoet", version.ref = "poet" }

kore-core = { module = "com.davils:kore-core", version.ref = "kore" }
knot-platform = { module = "com.davils:knot-platform", version.ref = "knot" }
konnect-internet-protocol = { module = "com.davils:konnect-internet-protocol", version.ref = "konnect" }

serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }

# Floors for transitive dependencies with a known vulnerability, see `kreate-plugin/build.gradle.kts`,
# `build-logic/build.gradle.kts` and the tool classpaths of `example/build.gradle.kts`.
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

asm-core = { module = "org.ow2.asm:asm", version.ref = "asm" }

# Reads the `kotlin.Metadata` annotation so that ABI validation can tell a Kotlin
# `internal` declaration from a genuinely public one — both are `public` in bytecode.
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }

# detekt rule sets applied to the plugin's own sources via `detektPlugins`
detekt-rules-ktlintWrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-rules-libraries = { module = "dev.detekt:detekt-rules-libraries", version.ref = "detekt" }

# The API `:kreate-detekt-rules` is written against. `compileOnly` there: Detekt puts its own copy
# on the analysis classpath, and a rule set that shipped a second one would load two of everything.
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }

# testing
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5-jvm", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
kotest-property = { module = "io.kotest:kotest-property-jvm", version.ref = "kotest" }
kore-testing = { module = "com.davils:kore-testing", version.ref = "kore" }

# actual plugins, but needed as dependencies in build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
serialization-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
allopen-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.allopen:org.jetbrains.kotlin.plugin.allopen.gradle.plugin", version.ref = "kotlin" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
publish-gradle-plugin = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "publish" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
bcv-gradle-plugin = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "bcv" }
benchmark-gradle-plugin = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-plugin", version.ref = "benchmark" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kotest-gradle-plugin = { module = "io.kotest:kotest-framework-plugin-gradle", version.ref = "kotest" }

[plugins]
kreate = { id = "com.davils.kreate" }
# `:kreate-detekt-rules` is a plain Kotlin/JVM library, so it names the Kotlin plugin explicitly
# rather than inheriting the one `kotlin-dsl` embeds in the plugin build.
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
build-logic = [
    "kotlin-gradle-plugin",
    "publish-gradle-plugin",
    "detekt-gradle-plugin",
    "bcv-gradle-plugin",
    "kover-gradle-plugin"
]

kreate-plugin = [
    "poet-core",
    "kore-core",
    "knot-platform",
    "konnect-internet-protocol",
    "serialization-json",
    "ktor-client-core",
    "ktor-client-java",
    "asm-core",
    "kotlin-metadata-jvm",
    "kotlin-gradle-plugin",
    "dokka-gradle-plugin",
    "serialization-gradle-plugin",
    "allopen-gradle-plugin",
    "publish-gradle-plugin",
    "detekt-gradle-plugin",
    "kover-gradle-plugin",
    "benchmark-gradle-plugin",
    "ksp-gradle-plugin",
    "kotest-gradle-plugin"
]

kreate-test = [
    "kotest-runner",
    "kotest-assertions",
    "mockk"
]
