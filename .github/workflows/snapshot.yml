name: Snapshot

# Publishes <version>-SNAPSHOT of every push to develop. A snapshot is never signed, so this
# workflow holds no signing key.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Snapshots overwrite each other, so two uploads must never interleave. A running upload is
# allowed to finish; the next one starts after it.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify the snapshot
    if: github.repository == 'davils-com/kreate' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_verify.yml
    permissions:
      contents: read

  publish:
    name: Publish to repo.davils.com
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Restrict the environment to the develop branch. It needs no reviewers.
    environment: snapshot

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      # No cache in the job that holds the repository token: what a cache restores was written by
      # another job, and it would run here with access to the token.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      # The rule set and the settings plugin first, because the plugin pins both to its own
      # version. The configuration cache stays off so that the token is never serialised.
      - name: Publish
        env:
          DAVILS_MAVEN_NAME: ${{ secrets.DAVILS_MAVEN_NAME }}
          DAVILS_MAVEN_SECRET: ${{ secrets.DAVILS_MAVEN_SECRET }}
        run: |
          set -euo pipefail

          for build in kreate-detekt-rules kreate-settings kreate-plugin; do
            ./gradlew ":$build:publishAllPublicationsToDavilsRepository" --no-configuration-cache --stacktrace
          done

      # The snapshots repository is private, so the consumer build needs the token as well.
      - name: Build a consumer project against the snapshot
        env:
          DAVILS_MAVEN_NAME: ${{ secrets.DAVILS_MAVEN_NAME }}
          DAVILS_MAVEN_SECRET: ${{ secrets.DAVILS_MAVEN_SECRET }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^version=//p' gradle.properties)"

          ./gradlew -p .github/smoke detekt \
            "-PkreateVersion=$declared-SNAPSHOT" \
            -PkreateRepository=https://repo.davils.com/snapshots \
            --no-configuration-cache --stacktrace
