name: Detekt

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: detekt-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detekt:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Required to publish the SARIF report to GitHub code scanning, which is what turns
      # findings into inline pull request annotations instead of buried log output.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      # `kreate-plugin` is an included build, so its tasks have to be addressed explicitly;
      # a bare `detekt` only matches the `:example` consumer project. `--continue` so that a
      # finding in one module still produces the reports of the others.
      - name: Run Detekt
        id: detekt
        run: ./gradlew :kreate-plugin:detekt :example:detekt --continue --stacktrace

      - name: Upload SARIF to code scanning
        # Runs even when Detekt failed — that is precisely when the findings matter.
        if: always()
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: kreate-plugin/build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-report
          path: kreate-plugin/build/reports/detekt/
          retention-days: 7

  api-compatibility:
    name: Binary compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      # Fails when the published DSL changed without the api dump being regenerated, so a
      # breaking change to a consumer's build script cannot be merged unnoticed.
      - name: Check the API dump is up to date
        run: |
          ./gradlew :kreate-plugin:apiCheck --stacktrace || {
            echo "::error::The public API changed. Run './gradlew apiDump' and commit kreate-plugin/api/kreate-plugin.api."
            exit 1
          }

      # Runs the feature Kreate ships rather than the plugin that inspired it. The example
      # project's dump is written by Kreate's own ASM based extractor, so a regression in
      # it fails here instead of in a consumer's build.
      - name: Check the example project's API dump is up to date
        run: |
          ./gradlew :example:kreateApiCheck --stacktrace || {
            echo "::error::The example project's API changed. Run './gradlew :example:kreateApiDump' and commit example/api/example.api."
            exit 1
          }
