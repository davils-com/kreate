name: Publish

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to Maven Central
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Point this at a protected GitHub environment so that a release requires an approval
    # and the signing secrets are not reachable from an ordinary branch build.
    environment: release

    permissions:
      contents: read

    env:
      CI_COMMIT_TAG: ${{ github.ref_name }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      KREATE_REQUIRE_CMAKE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      # A tag build must not be the first time the suite runs. Verifying before publishing
      # is the difference between a bad release and a red build.
      - name: Verify
        run: ./gradlew build --stacktrace

      - name: Publish
        run: ./gradlew :kreate-plugin:publishToMavenCentral --stacktrace
