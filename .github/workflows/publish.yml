name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions: {}

env:
  CI_COMMIT_TAG: ${{ github.ref_name }}
  KREATE_REQUIRE_CMAKE: 'true'
  KREATE_REQUIRE_TRIVY: 'true'

jobs:
  # Everything that runs third-party code happens here, in a job that holds no secret. A compromised
  # tool or test dependency has nothing to steal: the signing key exists only in the publish job.
  verify:
    name: Verify the release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can point at any commit, so without this anyone allowed to push a tag could release
      # an unreviewed commit. The tag name reaches the script through the environment, never
      # through an expression, so it cannot inject shell.
      - name: Refuse a tag that is not a release of main
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $CI_COMMIT_TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

          declared="$(sed -n 's/^version=//p' gradle.properties)"
          released="${CI_COMMIT_TAG#v}"

          if [ "$declared" != "$released" ]; then
            echo "::error::Tag $CI_COMMIT_TAG does not match version=$declared in gradle.properties."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      # The example's secret scan runs as part of `check`, so `verify` below needs Trivy.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          path: ${{ runner.temp }}

      # A tag build must not be the first time the suite runs. Verifying before publishing
      # is the difference between a bad release and a red build.
      - name: Verify
        run: ./gradlew verify --configuration-cache --stacktrace

      - name: Generate a CycloneDX SBOM
        run: trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Keep the SBOM for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          retention-days: 90

  publish:
    name: Publish to Maven Central
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The environment is the approval gate: give it required reviewers and restrict it to release
    # tags, because `automaticRelease` leaves nothing to approve on Maven Central afterwards.
    environment: release

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      # No cache at all in the job that holds the signing key: what a cache restores was written
      # by another job, and it would run here with access to the key.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      # Both artefacts, in one invocation: the plugin pins the rule set to its own version, so
      # a release that shipped only the plugin would configure a `detektPlugins` dependency that
      # cannot resolve. The secrets live on this one step, and the configuration cache stays off so
      # that they are never serialised.
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        run: >
          ./gradlew
          :kreate-plugin:publishToMavenCentral :kreate-settings:publishToMavenCentral :kreate-detekt-rules:publishToMavenCentral
          --no-configuration-cache --stacktrace

      - name: Attest the provenance of the released JARs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            kreate-plugin/build/libs/*.jar
            kreate-settings/build/libs/*.jar
            kreate-detekt-rules/build/libs/*.jar

      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom

      - name: Attest the SBOM of the released JARs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            kreate-plugin/build/libs/*.jar
            kreate-settings/build/libs/*.jar
            kreate-detekt-rules/build/libs/*.jar
          sbom-path: sbom.cdx.json
