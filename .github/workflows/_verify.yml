name: Verify

# The gate both publishing workflows share. It runs third-party code and holds no secret, so a
# compromised tool or test dependency has nothing to steal.
on:
  workflow_call:
    inputs:
      release-tag:
        description: The tag a release is cut from. Empty for a snapshot.
        type: string
        required: false
        default: ''
      sbom:
        description: Whether to keep a CycloneDX SBOM for the publish job.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      # Only a release tag removes the -SNAPSHOT suffix. The tag reaches the build through the
      # environment, never through an expression, so it cannot inject shell.
      CI_COMMIT_TAG: ${{ inputs.release-tag }}
      KREATE_REQUIRE_CMAKE: 'true'
      KREATE_REQUIRE_TRIVY: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      # The example's secret scan runs as part of `check`, so `verify` below needs Trivy.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          path: ${{ runner.temp }}

      # Publishing must not be the first time the suite runs. Verifying before publishing is the
      # difference between a bad artefact and a red build.
      - name: Verify
        run: ./gradlew verify --configuration-cache --stacktrace

      - name: Generate a CycloneDX SBOM
        if: inputs.sbom
        run: trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Keep the SBOM for the publish job
        if: inputs.sbom
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom.cdx.json
          retention-days: 90
