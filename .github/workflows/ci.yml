name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancel it rather than
# pay for a matrix that nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Turns a missing CMake into a test failure instead of a silent skip. Locally the native
  # tests may be skipped; in CI they must not be.
  KREATE_REQUIRE_CMAKE: 'true'

jobs:
  build:
    name: Build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      contents: read

    strategy:
      # One platform failing is exactly the signal this matrix exists to produce, so let
      # the others finish and report too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Verifies the checked-in gradle-wrapper.jar against the published checksums.
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # The JNI pipeline shells out to CMake. Without it the native tests would be skipped
      # and this matrix would prove nothing about the cross-platform behaviour it exists for.
      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Verify CMake
        run: cmake --version

      # `kreate-plugin` is an included build. The root `build` task only reaches it far
      # enough to produce the JAR that `:example` consumes — it runs none of the plugin's
      # own tests, Detekt, or apiCheck. Both targets are therefore named explicitly, or CI
      # would report green without a single plugin test having run.
      - name: Build and check
        run: ./gradlew :kreate-plugin:build build --configuration-cache --stacktrace

      - name: Verify the example consumer end to end
        # Exercises the published DSL the way a consumer does: scaffolds, generates headers,
        # builds the native library, packages it and actually loads it at runtime.
        run: ./gradlew :example:run --configuration-cache --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            kreate-plugin/build/reports/tests/
            kreate-plugin/build/test-results/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Measure and verify coverage
        run: >
          ./gradlew
          :kreate-plugin:koverXmlReport :kreate-plugin:koverHtmlReport
          :kreate-plugin:koverLog :kreate-plugin:koverVerify
          --configuration-cache --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: kreate-plugin/build/reports/kover/
          retention-days: 7

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      # The build conventions pin archive timestamps and file order. This proves it, which
      # is what makes an artifact independently verifiable against its source.
      # Two things this step has to get right, both of which produced false results before:
      #
      #   * `clean` and `jar` must be separate invocations. Gradle does not order them relative
      #     to each other within a single build, and it ran `clean` last — deleting the JAR that
      #     was about to be checksummed.
      #   * Both runs must start from a clean build directory. Otherwise the glob picks up
      #     artifacts left by an earlier task (the sources and javadoc jars) in one run but not
      #     the other, and compares different sets of files.
      - name: Build the plugin JAR twice and compare checksums
        run: |
          set -euo pipefail

          checksum() {
            ./gradlew --quiet :kreate-plugin:clean
            ./gradlew --quiet :kreate-plugin:jar
            sha256sum kreate-plugin/build/libs/*.jar | awk '{print $1}'
          }

          checksum > first.sha256
          checksum > second.sha256

          if ! diff first.sha256 second.sha256; then
            echo "::error::The plugin JAR is not reproducible: the same source produced different archives."
            exit 1
          fi
          echo "Reproducible: $(cat first.sha256)"
