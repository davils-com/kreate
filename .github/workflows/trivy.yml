name: Trivy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  schedule:
    # A dependency that was clean yesterday can have a CVE today, so scan on a schedule
    # and not only when someone happens to push.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy-vuln.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Reporting only; the job's verdict comes from the gate step below, so that a
          # newly disclosed CVE never silently swallows the SARIF upload.
          exit-code: '0'

      - name: Upload vulnerability SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-vuln

      - name: Scan for hard-coded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: secret
          # Trivy loads trivy-secret.yaml from the working directory: the same rules the plugin's
          # own trivy DSL points at, so a secret that CI would catch is also caught by a developer
          # running the Gradle task locally.
          format: sarif
          output: trivy-secret.sarif
          exit-code: '0'

      - name: Upload secret SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-secret

      # A leaked credential is not a "review later" finding: any secret, whatever its severity,
      # fails the build immediately.
      - name: Fail on secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '1'

      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: vuln
          format: table
          severity: CRITICAL
          exit-code: '1'

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate a CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  dogfood:
    name: Kreate's own Trivy tasks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          path: ${{ runner.temp }}

      # The plugin's scan tasks consume dependency lock files, so they have to exist first.
      # `--write-locks` only records what a build actually resolves, and the `dependencies`
      # report does not resolve every locked classpath; the task Kreate registers does.
      - name: Write dependency locks
        run: ./gradlew :example:kreateResolveAndLockAll --write-locks --stacktrace

      # Runs the feature Kreate ships, not a third-party action. If the plugin's own Trivy
      # integration breaks, this job is what notices.
      - name: Run the plugin's Trivy tasks
        run: ./gradlew :example:kreateTrivyScan --stacktrace

      # Kreate's own dependencies go through Kreate's own gate. It reads OSV.dev, which is why it runs
      # here and not in `verify`, and it fails the job on anything `failOn` catches.
      - name: Audit Kreate's own dependencies
        run: ./gradlew :selfcheck:kreateAssurance --stacktrace

      - name: Upload the assurance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-report
          path: selfcheck/build/kreate/assurance/
          retention-days: 30
