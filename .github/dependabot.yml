version: 2

# The Kotlin version is never updated by Dependabot. It is not an ordinary dependency: it governs
# the language Kreate's own sources are written in, the API level consumers are compiled against,
# and the Gradle plugin surface every module builds on. Raising it is a deliberate, coordinated
# change — see docs/topics/Compatibility.md — not something to merge from a bot that has only
# checked that resolution still succeeds.
#
# The patterns are anchored on the group with an explicit colon on purpose. A bare
# `org.jetbrains.kotlin*` would also swallow `org.jetbrains.kotlinx`, taking Kover,
# kotlinx-benchmark and the binary compatibility validator out of the updates with it.
#
# kotlinx-serialization and Ktor may not need a newer stdlib than Kotlin 2.4.21, the one of
# Gradle 9.9, Kreate's minimum. The reason is in gradle/libs.versions.toml; it moves when the minimum does.
#
# Gradle is watched from the repository root only. Every included build reads its versions from
# the one catalog in gradle/libs.versions.toml and declares none of its own, so an entry per
# included build would open the same pull request once more for each of them.
#
# Minor and patch updates arrive as one pull request per ecosystem, majors one by one, and a new
# version waits a few days before it is proposed. Dependabot changes versions only: the
# dependencies stage of the pipeline regenerates the lock files and the verification metadata
# and commits them to the pull request, see CONTRIBUTING.md.

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      # kotlin-gradle-plugin, kotlin-metadata-jvm, kotlin-test, the stdlib
      - dependency-name: "org.jetbrains.kotlin:*"
      # the marker artifacts behind `kotlin("jvm")` and `kotlin("multiplatform")`
      - dependency-name: "org.jetbrains.kotlin.jvm:*"
      - dependency-name: "org.jetbrains.kotlin.multiplatform:*"
      # the compiler plugins Kreate applies: serialization, allopen
      - dependency-name: "org.jetbrains.kotlin.plugin.*:*"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
      - dependency-name: "io.ktor:*"

  # The only action this repository names is the pipeline of davils-com/kotlin-workflow, pinned
  # to a commit in .github/workflows/pipeline.yml. This entry moves that pin forward.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
